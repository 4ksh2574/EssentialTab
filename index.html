<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f3f5f7">
  <meta name="description" content="A quiet, personal place to begin browsing.">
  <title>EssentialTab</title>
  <style>
    :root{color-scheme:light dark;--bg:#f3f5f7;--ink:#20252b;--muted:#818994;--glass:rgba(255,255,255,.56);--line:rgba(255,255,255,.76);--accent:#71978a;--shadow:0 18px 60px rgba(37,48,61,.08)}
    @media(prefers-color-scheme:dark){:root{--bg:#171b20;--ink:#f1f3f5;--muted:#9aa3ad;--glass:rgba(255,255,255,.065);--line:rgba(255,255,255,.11);--accent:#a0c2b4;--shadow:0 18px 60px rgba(0,0,0,.18)}}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}
    body{min-height:100vh;background:var(--bg);color:var(--ink);overflow:hidden;transition:background .3s,color .3s}
    .backdrop{position:fixed;inset:0;z-index:-1;background:radial-gradient(ellipse at 18% 18%,rgba(184,207,198,.38),transparent 38%),radial-gradient(ellipse at 82% 76%,rgba(194,198,224,.28),transparent 38%),var(--bg)}
    @media(prefers-color-scheme:dark){.backdrop{background:radial-gradient(ellipse at 18% 18%,rgba(67,104,91,.19),transparent 40%),radial-gradient(ellipse at 82% 76%,rgba(75,76,112,.16),transparent 40%),var(--bg)}}
    main{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:28px}
    .content{width:min(100%,620px);text-align:center;margin-top:-3vh}
    .date{font-size:13px;letter-spacing:.025em;color:var(--muted);margin-bottom:16px}
    .clock{font-size:clamp(64px,13vw,104px);font-weight:520;letter-spacing:-.085em;line-height:1;font-variant-numeric:tabular-nums}
    .greeting{font-size:15px;color:var(--muted);margin:17px 0 38px}
    .search{height:58px;padding:0 19px;display:flex;align-items:center;gap:13px;border:1px solid var(--line);border-radius:19px;background:var(--glass);box-shadow:var(--shadow),inset 0 1px rgba(255,255,255,.45);backdrop-filter:blur(28px) saturate(150%);-webkit-backdrop-filter:blur(28px) saturate(150%);transition:border-color .2s,transform .2s}
    .search:focus-within{border-color:color-mix(in srgb,var(--accent) 60%,transparent);transform:translateY(-1px)}
    .search svg{width:19px;height:19px;stroke:var(--muted);flex:none}
    input{width:100%;border:0;outline:0;background:transparent;color:var(--ink);font:inherit;font-size:14px}
    input::placeholder{color:var(--muted)}
    .enter{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:7px;padding:4px 7px}
    .shortcuts{display:flex;justify-content:center;gap:27px;margin:31px auto 0;flex-wrap:wrap}
    .shortcut{width:66px;color:var(--muted);text-decoration:none;font-size:11px;display:flex;align-items:center;flex-direction:column;gap:9px;transition:transform .2s,color .2s}
    .shortcut:hover{transform:translateY(-3px);color:var(--ink)}
    .glyph{width:43px;height:43px;border-radius:15px;display:grid;place-items:center;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(18px);box-shadow:0 7px 24px rgba(40,50,60,.055);color:var(--ink)}
    .glyph svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
    .footer{position:fixed;bottom:22px;left:0;right:0;text-align:center;color:var(--muted);font-size:10px;letter-spacing:.08em;opacity:.7}
    @media(max-width:480px){main{padding:22px}.content{margin-top:-5vh}.greeting{margin-bottom:30px}.shortcuts{gap:19px;margin-top:27px}.shortcut{width:58px}.glyph{width:42px;height:42px}.footer{bottom:15px}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;scroll-behavior:auto!important}}
  </style>
</head>
<body>
  <div class="backdrop"></div>
  <main>
    <section class="content" aria-label="New tab">
      <div class="date" id="date"></div>
      <div class="clock" id="clock">--:--</div>
      <p class="greeting" id="greeting">A little space for what matters.</p>
      <form class="search" id="search" role="search">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 4.5 4.5"/></svg>
        <input id="query" type="text" placeholder="Search the web" autocomplete="off" aria-label="Search the web">
        <span class="enter">↵</span>
      </form>
      <nav class="shortcuts" aria-label="Favourite websites">
        <a class="shortcut" href="https://github.com/4ksh2574"><span class="glyph"><svg viewBox="0 0 24 24"><path d="M9 19c-4.3 1.4-4.3-2.5-6-3m12 6v-3.9a3.4 3.4 0 0 0-.9-2.7c3-.3 6.1-1.5 6.1-6.7a5.2 5.2 0 0 0-1.4-3.6 4.8 4.8 0 0 0-.1-3.6s-1.2-.4-3.8 1.4a13 13 0 0 0-6.9 0C5.4 1.1 4.2 1.5 4.2 1.5a4.8 4.8 0 0 0-.1 3.6 5.2 5.2 0 0 0-1.4 3.6c0 5.2 3.1 6.4 6.1 6.7a3.4 3.4 0 0 0-.9 2.7V22"/></svg></span>GitHub</a>
        <a class="shortcut" href="https://youtube.com"><span class="glyph"><svg viewBox="0 0 24 24"><rect x="2.5" y="5" width="19" height="14" rx="4"/><path d="m10 9 5 3-5 3z"/></svg></span>YouTube</a>
        <a class="shortcut" href="https://www.chess.com"><span class="glyph"><svg viewBox="0 0 24 24"><path d="M8 21h8M9 18h6l-1-4 3-4-2-2-2 2-2-2-2 2 3 4zM10 5a2 2 0 1 1 4 0c0 1-.5 1.5-1 2h-2c-.5-.5-1-1-1-2z"/></svg></span>Chess</a>
        <a class="shortcut" href="https://open.spotify.com"><span class="glyph"><svg viewBox="0 0 24 24"><path d="M4 9c5-1.5 11-.8 16 2M5 13c4-1.2 9-.7 13 1.5M6 17c3-1 6-.5 9 .8"/></svg></span>Spotify</a>
      </nav>
    </section>
  </main>
  <div class="footer">ESSENTIALTAB</div>
  <script>
    const clock=document.getElementById('clock'),date=document.getElementById('date'),greeting=document.getElementById('greeting');
    function tick(){const now=new Date(),h=now.getHours();clock.textContent=now.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',hour12:false});date.textContent=now.toLocaleDateString([], {weekday:'long',month:'long',day:'numeric'});greeting.textContent=h<12?'Good morning.':h<18?'Good afternoon.':'Good evening.'}
    tick();setInterval(tick,1000);
    document.getElementById('search').addEventListener('submit',e=>{e.preventDefault();const q=document.getElementById('query').value.trim();if(!q)return;const looksLikeUrl=/^(https?:\/\/|[\w-]+\.[a-z]{2,}(\/.*)?$)/i.test(q);location.href=looksLikeUrl?(q.startsWith('http')?q:'https://'+q):'https://www.google.com/search?q='+encodeURIComponent(q)});
  </script>
</body>
</html>
