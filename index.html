<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#edf5f2">
  <meta name="description" content="A quiet, personal place to begin browsing.">
  <title>EssentialTab</title>
  <style>
    :root{color-scheme:light dark;--bg:#edf4f1;--ink:#202a28;--muted:#82918d;--glass:rgba(255,255,255,.58);--line:rgba(255,255,255,.82);--accent:#278d79;--accent-soft:rgba(39,141,121,.13);--shadow:0 22px 70px rgba(34,75,66,.10)}
    @media(prefers-color-scheme:dark){:root{--bg:#111b19;--ink:#edf5f2;--muted:#91a49e;--glass:rgba(238,255,248,.065);--line:rgba(225,255,244,.12);--accent:#67c4ad;--accent-soft:rgba(103,196,173,.14);--shadow:0 22px 70px rgba(0,0,0,.28)}}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}
    body{min-height:100vh;background:var(--bg);color:var(--ink);overflow:hidden;transition:background .3s,color .3s}
    .backdrop{position:fixed;inset:0;z-index:-1;background:radial-gradient(ellipse at 17% 15%,rgba(91,177,151,.22),transparent 38%),radial-gradient(ellipse at 84% 78%,rgba(125,185,174,.22),transparent 38%),radial-gradient(ellipse at 52% 110%,rgba(194,221,211,.38),transparent 48%),var(--bg)}
    @media(prefers-color-scheme:dark){.backdrop{background:radial-gradient(ellipse at 18% 18%,rgba(67,104,91,.19),transparent 40%),radial-gradient(ellipse at 82% 76%,rgba(75,76,112,.16),transparent 40%),var(--bg)}}
    .time-panel{position:fixed;top:30px;left:34px;z-index:2;text-align:left}.time-panel .clock{font-size:clamp(30px,5vw,42px);font-weight:570;letter-spacing:-.075em;line-height:1.05;font-variant-numeric:tabular-nums}.time-panel .date{font-size:11px;color:var(--muted);margin-top:7px;letter-spacing:.035em}
    main{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:28px}
   .content{width:min(100%,660px);text-align:center;margin-top:2vh;animation:arrive .75s cubic-bezier(.2,.75,.25,1) both}@keyframes arrive{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
    .eyebrow{display:inline-flex;align-items:center;gap:8px;margin-bottom:29px;padding:7px 11px;border:1px solid var(--line);border-radius:999px;background:var(--glass);backdrop-filter:blur(18px);color:var(--muted);font-size:10px;letter-spacing:.16em;font-weight:650}.status-dot{width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
    .greeting{font-size:15px;color:var(--muted);margin:0 0 30px}
    .search{height:70px;padding:0 10px 0 22px;display:flex;align-items:center;gap:15px;border:1px solid color-mix(in srgb,var(--accent) 15%,var(--line));border-radius:24px;background:color-mix(in srgb,var(--glass) 88%,transparent);box-shadow:0 18px 55px rgba(34,75,66,.09),inset 0 1px 0 rgba(255,255,255,.72);backdrop-filter:blur(32px) saturate(175%);-webkit-backdrop-filter:blur(32px) saturate(175%);transition:border-color .25s,transform .25s,box-shadow .25s}
    .search:focus-within{border-color:color-mix(in srgb,var(--accent) 52%,transparent);transform:translateY(-2px);box-shadow:0 23px 65px rgba(34,100,83,.15),0 0 0 4px var(--accent-soft),inset 0 1px 0 rgba(255,255,255,.72)}
    .search svg{width:20px;height:20px;stroke:var(--accent);flex:none}
    .search input{font-size:15px;letter-spacing:.005em}
    .search-action{height:48px;min-width:49px;border:0;border-radius:17px;background:var(--accent);color:#fff;display:grid;place-items:center;box-shadow:0 6px 18px rgba(39,141,121,.22);cursor:pointer;transition:transform .2s,filter .2s}
    .search-action:hover{transform:scale(1.04);filter:brightness(1.06)}.search-action svg{stroke:#fff;width:19px;height:19px}
    input{width:100%;border:0;outline:0;background:transparent;color:var(--ink);font:inherit;font-size:14px}
    input::placeholder{color:var(--muted)}
    .enter{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:7px;padding:4px 7px}
    .shortcuts{display:flex;justify-content:center;gap:30px;margin:34px auto 0;flex-wrap:wrap}
    .shortcut{width:68px;color:var(--muted);text-decoration:none;font-size:11px;font-weight:520;display:flex;align-items:center;flex-direction:column;gap:10px;transition:transform .25s cubic-bezier(.2,.8,.2,1),color .2s}
    .shortcut:hover{transform:translateY(-5px);color:var(--accent)}
    .glyph{width:47px;height:47px;border-radius:17px;display:grid;place-items:center;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(20px) saturate(150%);box-shadow:0 9px 28px rgba(40,70,62,.075),inset 0 1px rgba(255,255,255,.5);color:var(--accent);transition:background .2s,border-color .2s,box-shadow .2s}
    .shortcut:hover .glyph{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 28%,var(--line));box-shadow:0 12px 30px rgba(39,141,121,.13),inset 0 1px rgba(255,255,255,.55)}
    .glyph img{width:23px;height:23px;object-fit:contain;border-radius:5px}.glyph img.youtube{width:26px;height:19px}.glyph img.chess{width:25px;height:25px}.glyph img.spotify{width:24px;height:24px}
    .footer{position:fixed;bottom:23px;left:0;right:0;text-align:center;color:var(--muted);font-size:9px;font-weight:600;letter-spacing:.2em;opacity:.72}.footer:before{content:"";display:block;width:22px;height:1px;background:var(--accent);opacity:.55;margin:0 auto 10px}
    @media(max-width:600px){.time-panel{top:20px;left:21px}.time-panel .clock{font-size:30px}.time-panel .date{font-size:10px}main{padding:22px}.content{margin-top:5vh}.eyebrow{margin-bottom:24px}.greeting{margin-bottom:25px}.search{height:62px;border-radius:20px;padding-left:17px}.search-action{height:44px;min-width:45px;border-radius:15px}.shortcuts{gap:20px;margin-top:29px}.shortcut{width:59px}.glyph{width:44px;height:44px}.footer{bottom:15px}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;scroll-behavior:auto!important}}
  </style>
</head>
<body>
  <div class="backdrop"></div>
  <aside class="time-panel" aria-label="Current time"><div class="clock" id="clock">--:--</div><div class="date" id="date"></div></aside>
  <main>
    <section class="content" aria-label="New tab">
      <div class="eyebrow"><span class="status-dot"></span> YOUR SPACE, YOUR START</div>
      <p class="greeting" id="greeting">A little space for what matters.</p>
      <form class="search" id="search" role="search">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 4.5 4.5"/></svg>
        <input id="query" type="text" placeholder="Search the web" autocomplete="off" aria-label="Search the web">
        <button class="search-action" type="submit" aria-label="Search"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
      </form>
      <nav class="shortcuts" aria-label="Favourite websites">
        <a class="shortcut" href="https://github.com/4ksh2574"><span class="glyph"><img src="https://www.google.com/s2/favicons?domain=github.com&sz=64" alt="" loading="lazy"></span>GitHub</a>
        <a class="shortcut" href="https://youtube.com"><span class="glyph"><img class="youtube" src="https://www.google.com/s2/favicons?domain=youtube.com&sz=64" alt="" loading="lazy"></span>YouTube</a>
        <a class="shortcut" href="https://www.chess.com"><span class="glyph"><img class="chess" src="https://www.google.com/s2/favicons?domain=chess.com&sz=64" alt="" loading="lazy"></span>Chess.com</a>
        <a class="shortcut" href="https://open.spotify.com"><span class="glyph"><img class="spotify" src="https://www.google.com/s2/favicons?domain=spotify.com&sz=64" alt="" loading="lazy"></span>Spotify</a>
      </nav>
    </section>
  </main>
  <div class="footer">ESSENTIALTAB</div>
  <script>
    const clock=document.getElementById('clock'),date=document.getElementById('date'),greeting=document.getElementById('greeting');
    function tick(){const now=new Date(),h=now.getHours();clock.textContent=now.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',hour12:false});date.textContent=now.toLocaleDateString([], {weekday:'long',month:'long',day:'numeric'});greeting.textContent=h<12?'Good morning.':h<18?'Good afternoon.':'Good evening.'}
    tick();setInterval(tick,1000);
    document.getElementById('search').addEventListener('submit',e=>{e.preventDefault();const q=document.getElementById('query').value.trim();if(!q)return;const looksLikeUrl=/^(https?:\/\/|[\w-]+\.[a-z]{2,}(\/.*)?$)/i.test(q);location.href=looksLikeUrl?(q.startsWith('http')?q:'https://'+q):'https://www.google.com/search?q='+encodeURIComponent(q)});
  </script>
</body>
</html>
